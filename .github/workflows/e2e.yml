name: E2E 清理测试

# 在干净的 Windows 虚拟机上种下假的 OfficePLUS 残留，跑一遍清理，
# 检查是否删干净、有没有误删。GitHub Actions 的 Windows 机器默认就是管理员权限。
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  python-cli:
    name: Python 版（GUI/exe 用的同一套清理代码）
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装
        run: pip install -e .
      - name: 正常运行的 Word 不应被当成威胁
        run: python tests/e2e/fake_residue.py office-scan
      - name: 种下假残留
        run: python tests/e2e/fake_residue.py plant
      - name: 清理前扫描
        run: |
          python -m remove_officeplus --scan
          python tests/e2e/fake_residue.py scan-check
      - name: 执行清理
        run: python -m remove_officeplus --nuke -f
      - name: 检查结果
        run: |
          python tests/e2e/fake_residue.py verify
          python tests/e2e/fake_residue.py log-check
      - name: 用备份文件恢复注册表
        run: python tests/e2e/fake_residue.py backup-check
      - name: 删除失败时必须如实报告，不能显示成功
        run: |
          python tests/e2e/fake_residue.py plant
          python tests/e2e/fake_residue.py lock-start
          python -m remove_officeplus --nuke -f
          $code = $LASTEXITCODE
          python tests/e2e/fake_residue.py lock-stop
          python tests/e2e/fake_residue.py log-check fail
          if ($code -eq 0) { Write-Error "有文件删不掉，清理却报告成功（退出码 0）"; exit 1 }
          python -m remove_officeplus --nuke -f
          if ($LASTEXITCODE) { Write-Error "文件解除占用后，第二次清理仍然失败"; exit 1 }
          python tests/e2e/fake_residue.py verify
      - name: 用其他管理员账号运行时，只清理登录用户的数据
        run: |
          python tests/e2e/other_user.py plant
          python tests/e2e/other_user.py run-python
          python tests/e2e/other_user.py verify
      - name: 非管理员启动时提权重启（python -m、main.py、取消 UAC）
        run: |
          python tests/e2e/fake_residue.py plant
          python tests/e2e/elevation_relaunch.py cancel
          python tests/e2e/elevation_relaunch.py module
          python tests/e2e/fake_residue.py verify
          python tests/e2e/fake_residue.py plant
          python tests/e2e/elevation_relaunch.py main-py
          python tests/e2e/fake_residue.py verify
      - name: 备份写不进去时不删注册表；已有备份不被覆盖
        run: |
          python tests/e2e/fake_residue.py plant
          python tests/e2e/fake_residue.py block-backup
          python -m remove_officeplus --nuke -f
          python tests/e2e/fake_residue.py registry-kept
          python tests/e2e/fake_residue.py unblock-backup
          python tests/e2e/fake_residue.py occupy-names
          python -m remove_officeplus --nuke -f
          python tests/e2e/fake_residue.py verify
          python tests/e2e/fake_residue.py names-check
      - name: 收尾
        if: always()
        run: |
          python tests/e2e/other_user.py cleanup
          python tests/e2e/fake_residue.py lock-stop
          python tests/e2e/fake_residue.py cleanup

  powershell:
    name: PowerShell 版（${{ matrix.shell }}）
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # powershell = Windows 自带的 5.1（大多数用户用的就是它）；pwsh = PowerShell 7
        shell: [ powershell, pwsh ]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 模拟一键命令（irm | iex）能否正常解析
        run: |
          # irm 会按 UTF-8 解码，且不会去掉开头的 BOM；这里照样构造字符串，交给对应版本的 PowerShell 解析
          & ${{ matrix.shell }} -NoProfile -Command '$t = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes(".\scripts\Remove-OfficePlus.ps1")); $null = [scriptblock]::Create($t); "parse ok"'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: 非管理员提权时应重新执行本地脚本，而不是重新下载
        run: |
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File .\tests\e2e\elevation-args.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: 正常运行的 Word 不应被当成威胁
        run: |
          python tests/e2e/fake_residue.py office-start
          $out = & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File .\scripts\Remove-OfficePlus.ps1 -Scan | Out-String
          python tests/e2e/fake_residue.py office-stop
          $out
          if ($out -match "WINWORD") { Write-Error "把正常运行的 Word 当成了威胁"; exit 1 }
      - name: 种下假残留
        run: python tests/e2e/fake_residue.py plant
      - name: 执行清理
        run: |
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File .\scripts\Remove-OfficePlus.ps1 -Nuke
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: 检查结果
        run: |
          python tests/e2e/fake_residue.py verify
          python tests/e2e/fake_residue.py log-check
      - name: 用备份文件恢复注册表
        run: python tests/e2e/fake_residue.py backup-check
      - name: 删除失败时必须如实报告，不能显示成功
        run: |
          python tests/e2e/fake_residue.py plant
          python tests/e2e/fake_residue.py lock-start
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File .\scripts\Remove-OfficePlus.ps1 -Nuke
          $code = $LASTEXITCODE
          python tests/e2e/fake_residue.py lock-stop
          python tests/e2e/fake_residue.py log-check fail
          if ($code -eq 0) { Write-Error "有文件删不掉，清理却报告成功（退出码 0）"; exit 1 }
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File .\scripts\Remove-OfficePlus.ps1 -Nuke
          if ($LASTEXITCODE) { Write-Error "文件解除占用后，第二次清理仍然失败"; exit 1 }
          python tests/e2e/fake_residue.py verify
      - name: 用其他管理员账号运行时，只清理登录用户的数据
        run: |
          python tests/e2e/other_user.py plant
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File .\tests\e2e\other-user.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/e2e/other_user.py verify
      - name: 双击 Quick-Remove.bat 也能正常清理
        if: matrix.shell == 'powershell'
        run: |
          # cmd.exe 按系统代码页读 .bat（中文系统是 GBK），文件必须是纯 ASCII + CRLF
          $t = [IO.File]::ReadAllText("Quick-Remove.bat", [Text.Encoding]::GetEncoding(28591))
          if ($t -match '[^\x00-\x7F]') { Write-Error "Quick-Remove.bat 含非 ASCII 字符"; exit 1 }
          if ($t -match "(?<!`r)`n") { Write-Error "Quick-Remove.bat 不是 CRLF 换行"; exit 1 }
          python tests/e2e/fake_residue.py plant
          # 模拟用户：确认清理输入 Y，后面几次回车应付“按任意键”
          "Y`r`n`r`n`r`n" | cmd /c Quick-Remove.bat
          python tests/e2e/fake_residue.py verify
      - name: 备份写不进去时不删注册表；已有备份不被覆盖
        run: |
          python tests/e2e/fake_residue.py plant
          python tests/e2e/fake_residue.py block-backup
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File .\scripts\Remove-OfficePlus.ps1 -Nuke
          python tests/e2e/fake_residue.py registry-kept
          python tests/e2e/fake_residue.py unblock-backup
          python tests/e2e/fake_residue.py occupy-names
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File .\scripts\Remove-OfficePlus.ps1 -Nuke
          python tests/e2e/fake_residue.py verify
          python tests/e2e/fake_residue.py names-check
      - name: 收尾
        if: always()
        run: |
          python tests/e2e/other_user.py cleanup
          python tests/e2e/fake_residue.py lock-stop
          python tests/e2e/fake_residue.py cleanup
