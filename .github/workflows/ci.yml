name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  python-lint:
    name: Ruff、编译检查和 pytest
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: 安装 ruff 和 pytest
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.3 pytest==9.2.0
      - name: Ruff（语法错误、未定义名称、未使用的导入）
        run: ruff check --select E9,F --target-version py38 .
      - name: 所有 Python 文件都能编译
        run: python -m compileall -q main.py build_exe.py src scripts tests
      - name: pytest
        run: python -m pytest -v tests

  powershell-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Invoke-ScriptAnalyzer -Path ./scripts/Remove-OfficePlus.ps1 -Severity Warning,Error -Recurse

  python-test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies & package
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install -e .
      - name: Python 和 PowerShell 两边的规则必须一致
        run: python scripts/sync_rules.py --check
        env:
          PYTHONUTF8: "1"
      - name: 真机样本里的残留必须都能被规则识别
        run: python tests/real_sample_check.py
        env:
          PYTHONUTF8: "1"
      - name: 图形界面如实提示清理结果
        run: python tests/gui_result_check.py
        env:
          PYTHONUTF8: "1"
      - name: Test Python CLI Syntax & Import
        run: |
          python -m remove_officeplus --scan

  package:
    name: 打包 exe（和发布时同一个脚本）
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: 打包
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.22.3
          pip install -e .
          python build_exe.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: 检查 exe 版本信息和校验文件
        run: |
          $v = python -c "import remove_officeplus; print(remove_officeplus.__version__)"
          $info = (Get-Item "dist\Remove-OfficePlus-GUI-v$v.exe").VersionInfo
          $info | Format-List ProductName, ProductVersion, FileVersion, CompanyName, LegalCopyright
          if ($info.ProductVersion -ne $v) { Write-Error "exe 版本号 $($info.ProductVersion) 和代码 $v 不一致"; exit 1 }
          if ($info.CompanyName -match "Microsoft") { Write-Error "exe 公司信息不能写微软"; exit 1 }
          $sum = (Get-FileHash "dist\Remove-OfficePlus-GUI-v$v.exe" -Algorithm SHA256).Hash.ToLower()
          $line = Get-Content dist\SHA256SUMS.txt
          $line
          if ($line -notmatch "^$sum ") { Write-Error "SHA256SUMS.txt 和 exe 不一致"; exit 1 }
          if (Test-Path *.spec) { Write-Error "打包在仓库根目录留下了 spec 文件"; exit 1 }
