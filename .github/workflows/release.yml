name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.22.3
          pip install -e .

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $v = python -c "import remove_officeplus; print(remove_officeplus.__version__)"
          if ("${{ github.ref_name }}" -ne "v$v") { Write-Error "标签 ${{ github.ref_name }} 和代码里的版本号 $v 不一致"; exit 1 }

      - name: Build Executable
        env:
          PYTHONUTF8: "1"  # 打包脚本会输出中文，英文环境下不设这个会直接崩溃
        run: |
          python build_exe.py

      - name: Upload Release Asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Remove-OfficePlus-GUI-v*.exe
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
