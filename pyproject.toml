[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "remove-officeplus"
version = "1.3.0"
description = "清理微软 OfficePLUS 加载项及残留"
readme = "README.md"
authors = [{ name = "程小宝 (Cheng Xiaobao)" }]
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
remove-officeplus = "remove_officeplus.cli:main"
remove-officeplus-gui = "remove_officeplus.gui:launch_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
remove_officeplus = ["rules.json"]
